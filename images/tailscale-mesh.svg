<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="mesh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.12"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="860" height="440" fill="url(#bg1)" rx="12"/>

  <text x="430" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">Tailscale 虚拟组网（Mesh VPN）</text>
  <text x="430" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">不同网络、不同地点的设备，加入同一个虚拟局域网，用固定的 100.x.x.x 内网 IP 直连</text>

  <!-- 物理网络边界：三个虚线框 -->
  <rect x="40" y="95" width="220" height="290" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="150" y="120" text-anchor="middle" font-size="12" fill="#94a3b8">🏠 家里（局域网 A）</text>

  <rect x="320" y="95" width="220" height="290" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="430" y="120" text-anchor="middle" font-size="12" fill="#94a3b8">☕ 咖啡馆（局域网 B）</text>

  <rect x="600" y="95" width="220" height="290" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="710" y="120" text-anchor="middle" font-size="12" fill="#94a3b8">📱 移动网络（4G/5G）</text>

  <!-- 虚拟网叠加层 -->
  <rect x="60" y="145" width="740" height="105" rx="16" fill="url(#mesh)" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="430" y="168" text-anchor="middle" font-size="11.5" fill="#6366f1" font-weight="600">Tailscale 虚拟内网（WireGuard · P2P 直连）</text>

  <!-- 设备节点 -->
  <g>
    <rect x="95" y="185" width="130" height="50" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="160" y="207" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">🖥 Mac 主力机</text>
    <text x="160" y="224" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#3b82f6">100.64.0.1</text>
  </g>
  <g>
    <rect x="365" y="185" width="130" height="50" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="430" y="207" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">💻 Windows 本</text>
    <text x="430" y="224" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#8b5cf6">100.64.0.2</text>
  </g>
  <g>
    <rect x="645" y="185" width="130" height="50" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="710" y="207" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">📱 手机</text>
    <text x="710" y="224" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="#10b981">100.64.0.3</text>
  </g>

  <!-- 直连线 -->
  <line x1="225" y1="210" x2="365" y2="210" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="495" y1="210" x2="645" y2="210" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 服务示例 -->
  <g font-size="10.5" fill="#475569">
    <rect x="95" y="270" width="130" height="98" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="160" y="290" text-anchor="middle" font-weight="600" fill="#334155">可访问的服务</text>
    <text x="160" y="312" text-anchor="middle" font-family="ui-monospace, monospace">Gitea :3000</text>
    <text x="160" y="332" text-anchor="middle" font-family="ui-monospace, monospace">博客预览 :4123</text>
    <text x="160" y="352" text-anchor="middle" font-family="ui-monospace, monospace">大模型 API :1234</text>
  </g>

  <g font-size="10.5" fill="#475569">
    <rect x="600" y="270" width="220" height="98" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="710" y="290" text-anchor="middle" font-weight="600" fill="#334155">任意设备直接访问</text>
    <text x="710" y="312" text-anchor="middle" font-family="ui-monospace, monospace" fill="#3b82f6">http://100.64.0.1:3000</text>
    <text x="710" y="332" text-anchor="middle" font-family="ui-monospace, monospace" fill="#3b82f6">http://100.64.0.1:1234</text>
    <text x="710" y="352" text-anchor="middle" font-size="10" fill="#94a3b8">无需公网 IP / 端口转发</text>
  </g>

  <text x="430" y="415" text-anchor="middle" font-size="11" fill="#94a3b8">提示：IP 为示例，实际每台设备有唯一的 100.x.x.x 地址</text>
</svg>
